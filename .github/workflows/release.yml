# Push a tag like v1.0.0 to release: the test suite and the Docker check
# must pass first, then the image is published to
# ghcr.io/<owner>/audible-watcher (tagged with the version and latest).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          v="${GITHUB_REF_NAME#v}"
          img="${{ steps.image.outputs.name }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$v" \
            -t "$img:$v" -t "$img:latest" .
          docker push "$img:$v"
          docker push "$img:latest"
