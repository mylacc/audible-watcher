# Copy to docker-compose.yml, set your time zone (the daily check runs at local time), then:
#   docker compose up -d      ->  http://<server>:5055
services:
  audible-watcher:
    build: .   # or skip building: image: ghcr.io/mylacc/audible-watcher:latest
    container_name: audible-watcher
    restart: unless-stopped
    ports: ["5055:5055"]
    environment:
      - TZ=America/Los_Angeles
      # - AW_ALLOWED_HOSTS=nas.example.com   # if you open it by a full domain name
      # - AW_PASSWORD=change-me             # require a password to open the app
    volumes:
      - ./data:/data
